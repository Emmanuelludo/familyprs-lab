name: Expand complete FamilyPRS source

on:
  push:
    branches: [main]
    paths:
      - 'source/chunks/**'
      - '.github/workflows/sync-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-sync
  cancel-in-progress: true

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          cat source/chunks/part_*.b64 > /tmp/familyprs-source.b64
          base64 --decode /tmp/familyprs-source.b64 > /tmp/familyprs-source.raw
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/familyprs-source.raw').read_bytes()
          sig = b'PK\x05\x06'
          pos = raw.find(sig)
          if pos < 0:
              raise SystemExit('ZIP end-of-central-directory record not found')
          if pos + 22 > len(raw):
              raise SystemExit('Truncated ZIP end-of-central-directory record')
          comment_len = int.from_bytes(raw[pos+20:pos+22], 'little')
          end = pos + 22 + comment_len
          Path('/tmp/FamilyPRS_Lab_Source_Code.zip').write_bytes(raw[:end])
          print(f'Trimmed reconstructed archive to {end} bytes')
          PY
          unzip -tq /tmp/FamilyPRS_Lab_Source_Code.zip

      - name: Expand complete project source
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -q /tmp/FamilyPRS_Lab_Source_Code.zip -d project
          rm -rf project/.pytest_cache project/tests/__pycache__

      - name: Commit expanded source if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project
          if git diff --cached --quiet; then
            echo 'Project source is already synchronized.'
          else
            git commit -m 'Sync complete FamilyPRS Lab project source'
            git push origin HEAD:main
          fi
